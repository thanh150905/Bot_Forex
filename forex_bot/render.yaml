services:
  - type: web
    name: forex-bot-license-server
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    
    region: singapore
    plan: free
    
    healthCheckPath: /health
    
    envVars:
      - key: SECRET_KEY
        value: change_me_to_64_char_random_string
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: change_me_to_strong_password
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./forex_license.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: your_email@gmail.com
      - key: SMTP_PASSWORD
        value: your_app_password
      - key: SMTP_FROM_EMAIL
        value: your_email@gmail.com
      - key: SMTP_FROM_NAME
        value: Forex Bot
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: ""
      - key: FRONTEND_URL
        value: https://your-app-name.onrender.com

databases:
  - name: forex-bot-data
    databaseName: forex_bot
    user: admin
    plan: free
